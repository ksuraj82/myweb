<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Container */
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Flying Stationary & Book Elements */
        .item {
            position: absolute;
            bottom: -150px;
            opacity: 0;
            animation: floatUp 15s linear infinite;
        }

        /* Distinct item sizes and paths */
        .item:nth-child(1) { left: 10%; width: 70px; height: 70px; animation-duration: 14s; animation-delay: 0s; }
        .item:nth-child(2) { left: 25%; width: 50px; height: 50px; animation-duration: 18s; animation-delay: 3s; }
        .item:nth-child(3) { left: 45%; width: 80px; height: 80px; animation-duration: 16s; animation-delay: 1s; }
        .item:nth-child(4) { left: 65%; width: 55px; height: 55px; animation-duration: 20s; animation-delay: 6s; }
        .item:nth-child(5) { left: 85%; width: 75px; height: 75px; animation-duration: 15s; animation-delay: 2s; }
        .item:nth-child(6) { left: 35%; width: 60px; height: 60px; animation-duration: 13s; animation-delay: 8s; }
        .item:nth-child(7) { left: 75%; width: 65px; height: 65px; animation-duration: 17s; animation-delay: 4s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            15% {
                opacity: 0.25; /* Subtle white visibility in the background */
            }
            85% {
                opacity: 0.25;
            }
            100% {
                transform: translateY(-120vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Maintenance Notice Container */
        .maintenance-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .ticket {
            display: inline-block;
            background: #ffffff;
            color: #0a0a0a;
            padding: 0.5rem 1.5rem;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.2rem;
            color: #a0a0a0;
            line-height: 1.6;
        }

        /* Responsive scaling */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Visible Animated Items -->
    <div class="background-animation">
        <!-- Flying Book 1 -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        
        <!-- Pencil -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="2" x2="22" y2="6"></line>
            <path d="M7.5 20.5 2 22l1.5-5.5L17 3a2.828 2.828 0 1 1 4 4z"></path>
        </svg>

        <!-- Open Book -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>

        <!-- Ruler -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="9"></line>
            <line x1="9" y1="13" x2="13" y2="13"></line>
            <line x1="9" y1="17" x2="11" y2="17"></line>
        </svg>

        <!-- Graduation Cap -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 10 12 5 2 10 12 15 22 10"></polyline>
            <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
            <line x1="22" y1="10" x2="22" y2="16"></line>
        </svg>

        <!-- Paperclip -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>

        <!-- Compass -->
        <svg class="item" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5" r="2"></circle>
            <path d="m4 22 6-15 2-3 2 3 6 15"></path>
            <path d="M8 16h8"></path>
        </svg>
    </div>

    <!-- Maintenance Notice Box -->
    <div class="maintenance-container">
        <div class="ticket">learnit-guide</div>
        <h1>We are under maintenance.</h1>
        <p>Please be patient. Some new feature is cooking.</p>
    </div>

</body>
</html>
